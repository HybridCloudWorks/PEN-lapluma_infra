    <text x="62" y="357" class="box-desc" fill="#B06000" opacity="0.9">Catches AADSTS90094</text>
    <text x="62" y="372" class="box-desc" fill="#B06000" opacity="0.8">One-Tap Admin Invite &amp; Copy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="115" width="280" height="80" rx="8" ry="8" fill="#F3E8FD" stroke="#A142F4" stroke-width="2"/>
    <text x="372" y="139" class="box-title" fill="#681DA8">Microsoft Entra ID</text>
    <text x="372" y="157" class="box-desc" fill="#681DA8" opacity="0.9">Multi-Tenant (/organizations)</text>
    <text x="372" y="172" class="box-desc" fill="#681DA8" opacity="0.8">SAML 2.0 WebSSO &amp; OIDC</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="215" width="280" height="80" rx="8" ry="8" fill="#F3E8FD" stroke="#A142F4" stroke-width="2"/>
    <text x="372" y="239" class="box-title" fill="#681DA8">Google Workspace</text>
    <text x="372" y="257" class="box-desc" fill="#681DA8" opacity="0.9">Hosted Domain Scoping (hd)</text>
    <text x="372" y="272" class="box-desc" fill="#681DA8" opacity="0.8">SAML 2.0 &amp; Google OIDC</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="315" width="280" height="80" rx="8" ry="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>
    <text x="372" y="339" class="box-title" fill="#B06000">iCloud Keychain</text>
    <text x="372" y="357" class="box-desc" fill="#B06000" opacity="0.9">FIDO2 Platform Authenticator</text>
    <text x="372" y="372" class="box-desc" fill="#B06000" opacity="0.8">Hardware Secure Enclave</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="115" width="340" height="80" rx="8" ry="8" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
