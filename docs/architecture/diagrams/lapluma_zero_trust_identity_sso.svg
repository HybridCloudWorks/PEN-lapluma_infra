    <text x="722" y="157" class="box-desc" fill="#0D652D" opacity="0.9">Cryptographic XML DSig Verification</text>
    <text x="722" y="172" class="box-desc" fill="#0D652D" opacity="0.8">X.509 Certificate Chain Validation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="215" width="340" height="80" rx="8" ry="8" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
    <text x="722" y="239" class="box-title" fill="#0D652D">JWT Token Minting Engine</text>
    <text x="722" y="257" class="box-desc" fill="#0D652D" opacity="0.9">Asymmetric RS256/ES256 Signatures</text>
    <text x="722" y="272" class="box-desc" fill="#0D652D" opacity="0.8">Tenant Scoping &amp; tid Claim Enforcement</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="315" width="340" height="80" rx="8" ry="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>
    <text x="722" y="339" class="box-title" fill="#B06000">Step-Up &amp; Passkey Authority</text>
    <text x="722" y="357" class="box-desc" fill="#B06000" opacity="0.9">Server-Side Cryptographic Entropy</text>
    <text x="722" y="372" class="box-desc" fill="#B06000" opacity="0.8">FIDO2 Assertion Signature Check</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="415" width="340" height="75" rx="8" ry="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/>
    <text x="722" y="439" class="box-title" fill="#C5221F">Immutable Auth Audit Log</text>
    <text x="722" y="457" class="box-desc" fill="#C5221F" opacity="0.9">PostgreSQL 16 Multi-Tenant Store</text>
    <text x="722" y="472" class="box-desc" fill="#C5221F" opacity="0.8">Anti-Replay Assertion ID Cache</text>
  </g><path d="M 290 152 L 360 355" class="arrow-secure" stroke="#FBBC04" marker-end="url(#arrowhead-secure)"/><path d="M 290 252 L 360 155" class="arrow-secure" stroke="#FBBC04" marker-end="url(#arrowhead-secure)"/><path d="M 290 252 L 360 255" class="arrow-secure" stroke="#FBBC04" marker-end="url(#arrowhead-secure)"/><path d="M 640 155 L 710 155" class="arrow-secure" stroke="#FBBC04" marker-end="url(#arrowhead-secure)"/><text x="675" y="147" class="edge-label">SAML POST</text><path d="M 640 255 L 710 155" class="arrow-secure" stroke="#FBBC04" marker-end="url(#arrowhead-secure)"/><text x="675" y="200" class="edge-label">SAML POST</text><path d="M 640 355 L 710 355" class="arrow-secure" stroke="#FBBC04" marker-end="url(#arrowhead-secure)"/><text x="675" y="347" class="edge-label">Assertion</text><path d="M 880 195 L 880 215" class="arrow" stroke="#5F6368" marker-end="url(#arrowhead)"/><path d="M 880 315 L 880 295" class="arrow" stroke="#5F6368" marker-end="url(#arrowhead)"/><path d="M 880 395 L 880 415" class="arrow" stroke="#5F6368" marker-end="url(#arrowhead)"/></svg>