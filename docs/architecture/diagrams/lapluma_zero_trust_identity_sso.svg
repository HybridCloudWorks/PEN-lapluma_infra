    <text x="62" y="157" class="box-desc" fill="#174EA6" opacity="0.9">Passkey (WebAuthn / FIDO2)</text>
    <text x="62" y="172" class="box-desc" fill="#174EA6" opacity="0.8">Email OTP / TOTP Fallback</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="50" y="215" width="240" height="75" rx="8" ry="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
    <text x="62" y="239" class="box-title" fill="#174EA6">Clinic Caseworker</text>
    <text x="62" y="257" class="box-desc" fill="#174EA6" opacity="0.9">Institutional Google / Entra ID</text>
    <text x="62" y="272" class="box-desc" fill="#174EA6" opacity="0.8">ASWebAuthenticationSession</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="50" y="315" width="240" height="75" rx="8" ry="8" fill="#FEF7E0" stroke="#FBBC04" stroke-width="2"/>
