<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #FFFFFF;">
<defs>
  <style>
    .title { font-size: 16px; font-weight: 700; fill: #202124; }
    .subtitle { font-size: 12px; font-weight: 500; fill: #5f6368; }
    .lane-title { font-size: 13px; font-weight: 700; fill: #3c4043; }
    .box-title { font-size: 12px; font-weight: 700; }
    .box-desc { font-size: 10px; font-weight: 400; }
    .edge-label { font-size: 9px; font-weight: 600; fill: #444746; text-anchor: middle; }
    .arrow { stroke-width: 1.5; fill: none; }
    .arrow-secure { stroke-width: 2; stroke-dasharray: 4,3; fill: none; }
    .arrow-async { stroke-width: 2; fill: none; }
  </style>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#5F6368" />
  </marker>
  <marker id="arrowhead-secure" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#FBBC04" />
  </marker>
  <marker id="arrowhead-async" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#34A853" />
  </marker>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
  </filter>
</defs>
<text x="30" y="32" class="title">LaPluma Zero-Trust Identity &amp; Enterprise SSO Federation</text><text x="30" y="50" class="subtitle">Multi-Tenant SAML 2.0, OpenID Connect, Admin Consent Flow &amp; WebAuthn Passkeys</text>
  <rect x="30" y="70" width="280" height="500" rx="10" ry="10" fill="#F8F9FA" stroke="#4285F4" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 30 102 L 310 102" stroke="#4285F4" stroke-width="1.5"/>
  <text x="44" y="92" class="lane-title">Client Authentication Layer</text>
  <rect x="340" y="70" width="320" height="500" rx="10" ry="10" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 340 102 L 660 102" stroke="#A142F4" stroke-width="1.5"/>
  <text x="354" y="92" class="lane-title">Federated Identity Providers</text>
  <rect x="690" y="70" width="380" height="500" rx="10" ry="10" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 690 102 L 1070 102" stroke="#34A853" stroke-width="1.5"/>
  <text x="704" y="92" class="lane-title">LaPluma Identity &amp; Auth Broker</text>
