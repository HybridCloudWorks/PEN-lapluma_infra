<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #FFFFFF;">
<defs>
  <style>
    .title { font-size: 16px; font-weight: 700; fill: #202124; }
    .subtitle { font-size: 12px; font-weight: 500; fill: #5f6368; }
