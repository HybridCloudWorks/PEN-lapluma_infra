<text x="30" y="32" class="title">LaPluma Enterprise System Architecture (GCP &amp; Apple Native)</text><text x="30" y="50" class="subtitle">Complete Multi-Tier System Topology: Mobile Client, Ingress Perimeter, Cloud Run Microservices, and Secure Persistence</text>
