name: Foundation validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guard:
    name: Duplicate run guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Decide whether this run duplicates the pull_request run
        id: guard
        uses: ./.github/actions/duplicate-run-guard

  validate:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Resolve the Functions requirements
        # Nothing else installs this file — not a test, not a build — so an unsatisfiable pin is
        # otherwise invisible. That is not hypothetical: azure-functions 2.x requires Python >=3.13
        # while the 1.x line caps at <3.13, and the pin was raised across that boundary by an
        # automated update whose checks all passed. Resolving against the interpreter CI actually
        # uses is what turns that into a failure here rather than a surprise at deployment.
        run: python -m pip install --dry-run --quiet -r src/functions/requirements.txt

      - name: Validate contracts, priorities, placeholders, and secret absence
        run: python tools/validate_foundation.py

      - name: Run Python contract tests
        run: |
          python -m unittest discover -s src/document-processing -p 'test_*.py'
          python -m unittest discover -s src/functions -p 'test_*.py'
          python -m unittest discover -s tools -p 'test_*.py'
          python -m py_compile src/document-processing/*.py src/functions/*.py

      - name: Build .NET core API
        run: dotnet build src/core-api/LaPluma.CoreApi.csproj --configuration Release

      - name: Test .NET core API
        run: dotnet test src/core-api.tests/LaPluma.CoreApi.Tests.csproj --configuration Release

      - name: Pin the Bicep CLI version
        run: |
          az bicep install --version v0.46.1
          az bicep version

      - name: Compile Bicep without provisioning and fail on any diagnostic
        run: |
          set -o pipefail
          diagnostics="$RUNNER_TEMP/bicep-diagnostics.txt"
          az bicep build --file infra/main.bicep 2> "$diagnostics" || {
            cat "$diagnostics"
            exit 1
          }
          cat "$diagnostics"
          if grep -Eq '\) : (Error|Warning) ' "$diagnostics"; then
            echo "::error::Bicep emitted diagnostics; bicepconfig.json treats these as build failures."
            exit 1
          fi

      - name: Build non-root service images
        run: |
          docker build --tag lapluma-core-api:validation src/core-api
          docker build --tag lapluma-processing-worker:validation src/document-processing
