name: Security scanning

on:
  pull_request:
  push:
  schedule:
    # Weekly, so a newly published advisory is surfaced without waiting for the next commit.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  guard:
    name: Duplicate run guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Decide whether this run duplicates the pull_request run
        id: guard
        uses: ./.github/actions/duplicate-run-guard

  codeql:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, python]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: ${{ matrix.language }}
          # No build step: the C# project is a single csproj and the worker is interpreted.
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    # Deliberately not gated on the guard: this job runs only on pull_request, which is never
    # the duplicate, and needing the guard would let a guard failure suppress it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  image-scan:
    name: Image scan (${{ matrix.image.name }})
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: core-api
            context: src/core-api
          - name: processing-worker
            context: src/document-processing
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build the image
        run: docker build --tag lapluma-${{ matrix.image.name }}:scan ${{ matrix.image.context }}

      - name: Export the image for scanning
        # Scanning a tarball keeps the Docker socket out of the scanner's reach.
        run: docker save lapluma-${{ matrix.image.name }}:scan --output image.tar

      - name: Scan the image
        # Trivy runs from its own digest-pinned image rather than the marketplace action, whose
        # setup step fetches a release binary through an install script at run time — unpinned, and
        # observed failing outright on this repository.
        #
        # Scan once to JSON, then convert. The scan itself never fails the job, so the SARIF upload
        # and the human-readable table below always run: a gate that suppresses the report it is
        # gating on leaves a reviewer with a red check and nowhere to look.
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$PWD/.trivy-cache:/root/.cache/trivy" \
            --workdir /work \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image \
            --input image.tar \
            --format json \
            --output trivy-${{ matrix.image.name }}.json \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 0

      - name: Convert the image scan to SARIF
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            convert \
            --format sarif \
            --output trivy-${{ matrix.image.name }}.sarif \
            trivy-${{ matrix.image.name }}.json

      - name: Upload the image scan results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: container-${{ matrix.image.name }}

      - name: Fail on a fixable critical or high vulnerability
        # The gate. `--ignore-unfixed` is what makes enforcement honest: a CVE with no published fix
        # is not something this repository can act on, and failing the build on one would teach
        # reviewers that red means "wait for upstream" rather than "do something". What remains is a
        # vulnerability with a fix available, which is a base-image bump.
        #
        # This re-runs the scan rather than converting the JSON above, and that is deliberate. The
        # first version of this gate used `trivy convert --exit-code 1`, and its own CI log said
        # `[convert] To display the summary table, enable the scanners used during JSON report
        # generation` — convert had lost the scanner metadata, rendered nothing, and therefore had
        # nothing to fail on. It was a gate that could never fire, which is worse than no gate
        # because it looks like protection. The cache volume is shared with the scan step above, so
        # the second invocation reuses the vulnerability database rather than downloading it again.
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$PWD/.trivy-cache:/root/.cache/trivy" \
            --workdir /work \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image \
            --input image.tar \
            --format table \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1

  infrastructure-scan:
    name: Infrastructure scan
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Pin the Bicep CLI version
        run: |
          az bicep install --version v0.46.1
          az bicep version

      - name: Compile Bicep to an ARM template
        # Trivy has no Bicep parser, so scan the ARM template Bicep already compiles to.
        run: az bicep build --file infra/main.bicep --outfile arm-template.json

      - name: Scan the ARM template
        # Same shape as the image scan: report first, gate afterwards, so a failure still leaves the
        # findings in the Security tab and in this job's log.
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$PWD/.trivy-cache:/root/.cache/trivy" \
            --workdir /work \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            config arm-template.json \
            --format json \
            --output trivy-infrastructure.json \
            --severity CRITICAL,HIGH \
            --exit-code 0

      - name: Convert the infrastructure scan to SARIF
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            convert \
            --format sarif \
            --output trivy-infrastructure.sarif \
            trivy-infrastructure.json

      - name: Upload the infrastructure scan results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: trivy-infrastructure.sarif
          category: infrastructure

      - name: Fail on a critical or high misconfiguration
        # No `--ignore-unfixed` equivalent applies here: every misconfiguration Trivy reports against
        # the compiled ARM is one this repository can fix, because this repository wrote it.
        #
        # Re-runs the scan rather than converting, for the same reason as the image gate above: a
        # `trivy convert --exit-code 1` gate rendered nothing and so could never fail.
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$PWD/.trivy-cache:/root/.cache/trivy" \
            --workdir /work \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            config arm-template.json \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1
