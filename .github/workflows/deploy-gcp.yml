name: Deploy to GCP Cloud Run (P1)

# Where each environment deploys comes from repository variables, never from this file:
#
#   environment | project             | region             | WIF provider             | deployer service account
#   ------------|---------------------|--------------------|--------------------------|-------------------------
#   dev         | GCP_PROJECT_DEV     | GCP_REGION_DEV     | GCP_WIF_PROVIDER_DEV     | GCP_DEPLOYER_SA_DEV
#   staging     | GCP_PROJECT_STAGING | GCP_REGION_STAGING | GCP_WIF_PROVIDER_STAGING | GCP_DEPLOYER_SA_STAGING
#   pilot       | GCP_PROJECT_PILOT   | GCP_REGION_PILOT   | GCP_WIF_PROVIDER_PILOT   | GCP_DEPLOYER_SA_PILOT
#
# infra/scripts/setup-deploy-identity.ps1 -Environment <env> prepares the provider and the deployer
# account and prints the four `gh variable set` commands for that environment. The job stops before
# authenticating if any of the four is missing, and names it. Deploys run from main only: the
# provider accepts no other ref. See docs/runbooks/session-tokens-and-saml-identity-providers.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target GCP deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - pilot
        default: dev
      apply_migrations:
        description: 'Execute database migrations against Cloud SQL'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    name: Duplicate run guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Decide whether this run duplicates the pull_request run
        id: guard
        uses: ./.github/actions/duplicate-run-guard

  deploy:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    name: Deploy to GCP (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Resolve deployment target from repository variables
        id: target
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          GCP_PROJECT_DEV: ${{ vars.GCP_PROJECT_DEV }}
          GCP_REGION_DEV: ${{ vars.GCP_REGION_DEV }}
          GCP_WIF_PROVIDER_DEV: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          GCP_DEPLOYER_SA_DEV: ${{ vars.GCP_DEPLOYER_SA_DEV }}
          GCP_PROJECT_STAGING: ${{ vars.GCP_PROJECT_STAGING }}
          GCP_REGION_STAGING: ${{ vars.GCP_REGION_STAGING }}
          GCP_WIF_PROVIDER_STAGING: ${{ vars.GCP_WIF_PROVIDER_STAGING }}
          GCP_DEPLOYER_SA_STAGING: ${{ vars.GCP_DEPLOYER_SA_STAGING }}
          GCP_PROJECT_PILOT: ${{ vars.GCP_PROJECT_PILOT }}
          GCP_REGION_PILOT: ${{ vars.GCP_REGION_PILOT }}
          GCP_WIF_PROVIDER_PILOT: ${{ vars.GCP_WIF_PROVIDER_PILOT }}
          GCP_DEPLOYER_SA_PILOT: ${{ vars.GCP_DEPLOYER_SA_PILOT }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys run from main only (this run is on $GITHUB_REF). The workload identity provider accepts tokens for refs/heads/main and nothing else."
            exit 1
          fi

          case "$TARGET_ENVIRONMENT" in
            dev | staging | pilot) suffix="${TARGET_ENVIRONMENT^^}" ;;
            *) echo "::error::Unknown environment '$TARGET_ENVIRONMENT'."; exit 1 ;;
          esac

          missing=()
          for kind in PROJECT REGION WIF_PROVIDER DEPLOYER_SA; do
            name="GCP_${kind}_${suffix}"
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Repository variable(s) not set for $TARGET_ENVIRONMENT: ${missing[*]}. Run infra/scripts/setup-deploy-identity.ps1 -Environment $TARGET_ENVIRONMENT; it prints the gh variable set commands."
            exit 1
          fi

          project="GCP_PROJECT_${suffix}"; project="${!project}"
          region="GCP_REGION_${suffix}"; region="${!region}"
          provider="GCP_WIF_PROVIDER_${suffix}"; provider="${!provider}"
          deployer="GCP_DEPLOYER_SA_${suffix}"; deployer="${!deployer}"

          # A mis-pasted value otherwise fails much later, inside the auth action or gcloud.
          invalid=()
          [[ "$project" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || invalid+=("GCP_PROJECT_${suffix} is not a project ID")
          [[ "$region" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || invalid+=("GCP_REGION_${suffix} is not a region")
          [[ "$provider" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] || invalid+=("GCP_WIF_PROVIDER_${suffix} is not projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>")
          [[ "$deployer" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]+\.iam\.gserviceaccount\.com$ ]] || invalid+=("GCP_DEPLOYER_SA_${suffix} is not a service account email")
          if [ "${#invalid[@]}" -gt 0 ]; then
            printf '::error::%s\n' "${invalid[@]}"
            exit 1
          fi

          {
            echo "project_id=$project"
            echo "region=$region"
            echo "workload_identity_provider=$provider"
            echo "service_account=$deployer"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $TARGET_ENVIRONMENT to project $project ($region) as $deployer."

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          project_id: ${{ steps.target.outputs.project_id }}
          workload_identity_provider: ${{ steps.target.outputs.workload_identity_provider }}
          service_account: ${{ steps.target.outputs.service_account }}

      - name: Configure Docker authentication for Artifact Registry
        env:
          REGION: ${{ steps.target.outputs.region }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push microservice images
        env:
          REGION: ${{ steps.target.outputs.region }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          ENV: ${{ inputs.environment }}
          TAG: ${{ github.sha }}
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT_ID}/lapluma-services-${ENV}"
          
          echo "Building Core API image..."
          docker build --tag "${REPO}/core-api:${TAG}" --tag "${REPO}/core-api:latest" src/core-api
          docker push "${REPO}/core-api:${TAG}"
          docker push "${REPO}/core-api:latest"
          
          echo "Building Workflow API image..."
          docker build --tag "${REPO}/workflow-api:${TAG}" --tag "${REPO}/workflow-api:latest" src/workflow-api
          docker push "${REPO}/workflow-api:${TAG}"
          docker push "${REPO}/workflow-api:latest"
          
          echo "Building Document Processing Worker image..."
          docker build --tag "${REPO}/processing-worker:${TAG}" --tag "${REPO}/processing-worker:latest" src/document-processing
          docker push "${REPO}/processing-worker:${TAG}"
          docker push "${REPO}/processing-worker:latest"

      - name: Deploy Cloud Run services
        env:
          REGION: ${{ steps.target.outputs.region }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          ENV: ${{ inputs.environment }}
          TAG: ${{ github.sha }}
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT_ID}/lapluma-services-${ENV}"
          
          # --update-env-vars, not --set-env-vars: "set" deletes every variable it does not name,
          # which would strip the Terraform-managed Authentication__* and Saml__* variables and
          # leave both APIs failing closed.
          echo "Deploying Core API to Cloud Run..."
          gcloud run deploy "lp-core-api-${ENV}" \
            --project "${PROJECT_ID}" \
            --image "${REPO}/core-api:${TAG}" \
            --region "${REGION}" \
            --update-env-vars "ASPNETCORE_ENVIRONMENT=Development,Catalog__Source=fixture" \
            --memory 512Mi \
            --cpu 1 \
            --no-allow-unauthenticated \
            --quiet
            
          echo "Deploying Workflow API to Cloud Run..."
          gcloud run deploy "lp-wf-api-${ENV}" \
            --project "${PROJECT_ID}" \
            --image "${REPO}/workflow-api:${TAG}" \
            --region "${REGION}" \
            --update-env-vars "ASPNETCORE_ENVIRONMENT=Development,Workflow__Source=fixture" \
            --memory 512Mi \
            --cpu 1 \
            --no-allow-unauthenticated \
            --quiet
            
          echo "Deploying Document Processing Worker to Cloud Run..."
          gcloud run deploy "lp-proc-worker-${ENV}" \
            --project "${PROJECT_ID}" \
            --image "${REPO}/processing-worker:${TAG}" \
            --region "${REGION}" \
            --memory 512Mi \
            --cpu 1 \
            --no-allow-unauthenticated \
            --quiet

      - name: Validate database migration bundle
        if: inputs.apply_migrations == true
        run: |
          python tools/migrate_db.py verify
          python tools/migrate_db.py bundle -o /tmp/all_migrations.sql
          echo "Migration bundle ready ($(wc -l < /tmp/all_migrations.sql) lines)."
